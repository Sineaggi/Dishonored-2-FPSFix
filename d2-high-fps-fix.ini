[Fix]
; 1 bypasses the game's 120 FPS frame spinner. Use an NVIDIA/driver cap.
; Triple Buffering must remain Off. Set this to 0 to retain the game's cap.
UnlockAbove120=1

; 1 makes the turn per mouse count independent of the frame rate, above and
; below 120 FPS: the game's own look scaling divides by the simulation time
; step instead of the real frame time. Sensitivity then matches the unmodified
; game at its normal 120 FPS cap; if you raised the in-game sensitivity for an
; older version of this patch, lower it back to about half.
StabilizeMouseSensitivity=1

; 1 keeps the depth-hacked first-person body and arms aligned with the
; presentation-time camera prediction. This removes their 120 Hz root shake.
; This option alone leaves skeletal animation at the normal 120 Hz cadence;
; FirstPersonSkeletons below controls the separate renderer-only pose layer.
StabilizeFirstPersonHands=1

; 1 predicts camera rotation from the real time since the game last applied
; mouse look, while position keeps the simulation-time prediction. Mouse
; turning then stays even at frame rates that are not a multiple of 120 (for
; example 90 or 144 FPS). Cutscenes and menus keep the simulation-time rotation
; prediction. Ctrl+F10 switches between the two rotation rules in game for an
; A/B comparison. Set this to 0 to always use the simulation-time rule.
RealTimeTurnPrediction=1

[Interpolation]
; Validated presentation layers. Each layer fails closed when its required
; renderer layout, identity, continuity, or sample history is unavailable.

; Interpolates eligible rigid or positive uniform-scaled world-model position,
; rotation, and scale in a temporary renderer-only clone. It does not change
; entity or physics transforms.
WorldTransforms=1

; Experimental renderer-only root interpolation for the small ownerless
; exact-skinned cinematic class. Independently gated from ordinary world
; transforms and limited to models with at most 64 joints.
CinematicTransforms=1

; Unsupported shadow-caster prototype. Focused tests found transition crashes
; and caster flicker at the investigated renderer boundary. Keep this 0 for
; normal use; it remains present only because the source still contains the
; separately gated experimental path.
ShadowTransforms=0

; Experimental renderer-only interpolation of depth-hacked first-person bone
; palettes. This is independent of StabilizeFirstPersonHands: it does not
; replace or modify that option's camera-relative root correction.
FirstPersonSkeletons=1

; Experimental renderer-only interpolation of selected world skeletal poses.
; CPU animation and physics poses remain untouched; invalid histories snap.
WorldSkeletons=1

; Experimental renderer-only interpolation for small exact-skinned cinematic
; controls that have no ordinary world owner. This is independently gated,
; limited to at most 64 joints, and retains the normal layout/rigidity/history
; checks. It does not broaden WorldSkeletons ownership rules or cover cloth.
CinematicSkeletons=1

; Dynamically sheds skeletal interpolation first, then transform interpolation,
; when measured fixed-step/presentation cadence lacks useful 120 Hz headroom.
; Recovery uses the observed cost of each layer plus hysteresis. A materially
; faster scene gets one controlled cost-refresh probe, avoiding both stale
; expensive-scene estimates and a simple below/above-120 toggle loop. Manual
; F11/Alt+F11 selection suspends the adaptive gate until the next launch.
; Set this to 0 to keep every individually enabled interpolation layer active
; continuously, regardless of measured performance.
AdaptivePerformanceGate=1

; 1 keeps every enabled interpolation layer active during cutscenes (the game's
; cinematic state, such as vehicle rides), even when the adaptive gate would
; shed layers there; cutscene frames are also excluded from its measurements.
; After the cutscene the gate resumes its gameplay decision. Set this to 0 to
; let the adaptive gate manage cutscenes like gameplay.
FullInterpolationInCutscenes=1

; 1 keeps every enabled interpolation layer active while the game slows time
; (kill cams, executions, slowed-time powers), even when the adaptive gate
; would shed layers; those frames are also excluded from its measurements.
; Slow motion is read from the engine clock's time scales. Set this to 0 to let
; the adaptive gate manage slow motion like normal play.
FullInterpolationInSlowMotion=1

[Diagnostics]
; Used only by the investigation capture tool. Normal play should leave this 0.
Telemetry=0

; Development-only in-session performance probe. Ctrl+F11 starts/stops a
; measurement segment, F11 toggles all configured interpolation layers, and
; Alt+F11 cycles All -> Transforms only -> Skeletons only -> Off. Shift+F11
; toggles only first-person root stabilization. Each segment omits a 2-second
; warm-up and writes frame-time/cadence/work counters to the log.
; Keep this 0 for normal play after the A/B investigation is complete.
InterpolationABProbe=0

; 1 logs the engine clock's time scales when they change and summarizes each
; detected slow-motion period (a few lines per event). Set this to 0 to omit
; these lines.
TimeScaleLog=1
